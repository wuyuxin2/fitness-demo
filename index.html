<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>30天减脂挑战</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script>
        // 如果主CDN加载失败，尝试使用备用CDN
        window.addEventListener('error', function(e) {
            if (e.target.src && e.target.src.includes('cdnjs.cloudflare.com')) {
                const script = document.createElement('script');
                script.src = 'https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
                document.head.appendChild(script);
            }
        }, true);
    </script>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h2>30天减脂挑战</h2>
            <div style="margin: 10px 0;">
                <input type="date" id="startDate" style="padding: 8px;">
            </div>
            <div id="challengeInfo">
                <div id="startDate"></div>
                <div id="endDate"></div>
                <div id="countdown"></div>
            </div>
            <div class="buttons">
                <button class="start-btn" id="startBtn" onclick="startChallenge()">开始挑战</button>
                <button class="giveup-btn" id="giveupBtn" onclick="giveUpChallenge()">放弃挑战</button>
            </div>
        </div>

        <div id="recordForm" style="display: none;">
            <h3>每日记录 <span id="currentDay" style="font-size: 0.8em; color: #666;"></span></h3>
            <div style="margin-bottom: 10px;">
                <input type="date" id="recordDate" style="padding: 8px;">
            </div>

            <div class="record-group">
                <h4>体重与热量</h4>
                <div id="lastWeight"></div>
                <div id="lastCalorie"></div>
                <input type="number" id="weight" step="0.1" placeholder="体重（kg）">
                <input type="number" id="calorieDeficit" placeholder="热量缺口（kcal）" readonly>
            </div>

            <div class="record-group">
                <h4>饮食记录</h4>
                <div class="meal-group">
                    <label>早餐：</label>
                    <input type="number" id="breakfastCal" placeholder="热量">
                    <input type="text" id="breakfastDesc" placeholder="食物描述">
                </div>
                <div class="meal-group">
                    <label>午餐：</label>
                    <input type="number" id="lunchCal" placeholder="热量">
                    <input type="text" id="lunchDesc" placeholder="食物描述">
                </div>
                <div class="meal-group">
                    <label>晚餐：</label>
                    <input type="number" id="dinnerCal" placeholder="热量">
                    <input type="text" id="dinnerDesc" placeholder="食物描述">
                </div>
                <div class="meal-group">
                    <label>零食：</label>
                    <input type="number" id="snackCal" placeholder="热量">
                    <input type="text" id="snackDesc" placeholder="食物描述">
                </div>
            </div>

             <!-- 新增训练记录部分 -->
        <div class="record-group">
            <h4>训练记录</h4>
            <div class="exercise-group">
                <input type="text" id="exerciseName" placeholder="训练内容">
                <input type="number" id="exerciseDuration" placeholder="时长（分钟）">
                <input type="number" id="exerciseCalories" placeholder="消耗卡路里">
            </div>
        </div>
    
        <button class="submit-btn" onclick="submitRecord()">提交全部记录</button>

        <div id="chartContainer">
            <canvas id="weightChart"></canvas>
        </div>


        <div class="stats">
            <h3>今日总摄入：<span id="totalCalories">0</span> 大卡</h3>
        </div>

        <div class="nav-buttons">
            <button id="profileButton" onclick="showProfilePage()">个人信息设置</button>
        </div>
    </div>

    <div id="profileSummary" class="profile-summary">
        <div class="summary-content">
            <span id="summaryGender"></span>
            <span id="summaryAge"></span>
            <span id="summaryHeight"></span>
            <span id="summaryWeight"></span>
            <span id="summaryBMR"></span>
        </div>
    </div>

    <div id="profilePage" style="display: none;" class="container">
        <h2>个人信息设置</h2>
        <div class="profile-form">
            <div class="form-group">
                <label for="gender">性别：</label>
                <select id="gender" onchange="calculateBMR()">
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="age">年龄：</label>
                <input type="number" id="age" min="1" max="120" onchange="calculateBMR()">
            </div>
            
            <div class="form-group">
                <label for="height">身高 (cm)：</label>
                <input type="number" id="height" min="100" max="250" onchange="calculateBMR()">
            </div>
            
            <div class="form-group">
                <label for="profileWeight">体重 (kg)：</label>
                <input type="number" id="profileWeight" min="30" max="200" step="0.1" onchange="calculateBMR()">
            </div>
            
            <div class="form-group">
                <label for="activityLevel">日常活动水平：</label>
                <select id="activityLevel" onchange="calculateBMR()">
                    <option value="1.2">久坐不动</option>
                    <option value="1.375">轻度活动（每周运动1-3次）</option>
                    <option value="1.55">中度活动（每周运动3-5次）</option>
                    <option value="1.725">高度活动（每周运动6-7次）</option>
                    <option value="1.9">非常活跃（运动员水平）</option>
                </select>
            </div>

            <div class="results">
                <p>基础代谢率（BMR）：<span id="bmr">-</span> kcal/天</p>
                <p>每日消耗热量（TDEE）：<span id="tdee">-</span> kcal/天</p>
                <p>建议减重热量摄入：<span id="suggested">-</span> kcal/天</p>
            </div>

            <div class="button-group">
                <button onclick="saveAndReturn()" class="save-button">保存并返回</button>
                <button onclick="cancelAndReturn()" class="cancel-button">取消</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
